<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLORA GLADE // Enchanted Nature AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700&family=Nunito:wght@400;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --sky: #a1eafb;
            --grass: #7cfc00;
            --leaf: #2d5a27;
            --flower: #ff6b6b;
            --magic: #fff59d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(to bottom, #a1eafb 0%, #e8f5e9 100%);
            color: var(--leaf);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        /* ===== ANIMATED DECORATIONS ===== */
        .bird {
            position: fixed;
            width: 30px;
            height: 20px;
            background: #fff;
            border-radius: 50% 50% 0 0;
            animation: fly 15s linear infinite;
            opacity: 0.6;
            z-index: -1;
        }

        .bird::before,
        .bird::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 10px;
            background: #fff;
            border-radius: 50% 50% 0 0;
            top: 0;
        }

        .bird::before {
            left: -15px;
            transform: rotate(-30deg);
        }

        .bird::after {
            right: -15px;
            transform: rotate(30deg);
        }

        @keyframes fly {
            0% {
                left: -10%;
                top: 20%;
                transform: scale(0.5);
            }

            50% {
                top: 15%;
            }

            100% {
                left: 110%;
                top: 25%;
                transform: scale(0.8);
            }
        }

        /* ===== FRONT PAGE REDESIGN ===== */
        #frontPage {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            z-index: 10;
            transition: 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hero-title {
            position: relative;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(3rem, 12vw, 5rem);
            color: var(--leaf);
            text-shadow: 4px 4px 0px white, 8px 8px 0px rgba(0, 0, 0, 0.05);
            line-height: 1;
        }

        .sparkle {
            position: absolute;
            font-size: 2rem;
            animation: twinkle 1.5s infinite alternate;
        }

        .start-btn {
            margin-top: 40px;
            padding: 22px 60px;
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(to bottom, #ff8e53, #ff6b6b);
            border: none;
            border-radius: 100px;
            cursor: pointer;
            box-shadow: 0 10px 0px #d84315, 0 20px 30px rgba(216, 67, 21, 0.3);
            transition: 0.2s;
            font-family: 'Fredoka', sans-serif;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        .start-btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0px #d84315;
        }

        /* ===== MAIN APP UI ===== */
        #app {
            display: none;
            width: 95%;
            max-width: 450px;
            padding: 20px 0;
            opacity: 0;
        }

        .glass-hud {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            border: 6px solid white;
            padding: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .cam-view {
            width: 100%;
            height: 380px;
            background: #000;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .cam-view.mini {
            width: 110px;
            height: 110px;
            position: fixed;
            top: 30px;
            right: 30px;
            border: 4px solid white;
            z-index: 100;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-overlay {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            margin: 40px;
            pointer-events: none;
        }

        .capture-trigger {
            width: 80px;
            height: 80px;
            background: #fff;
            border: 8px solid var(--grass);
            border-radius: 50%;
            display: block;
            margin: -40px auto 20px;
            cursor: pointer;
            position: relative;
            z-index: 10;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        /* ===== RESULT CARD ===== */
        #result {
            display: none;
            margin-top: 20px;
            animation: cardIn 0.6s cubic-bezier(0.2, 1, 0.3, 1);
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .plant-preview {
            width: 100%;
            height: 220px;
            background: #f0f0f0;
            border-radius: 25px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 4px solid #fff;
        }

        .plant-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info-pill {
            background: var(--grass);
            color: var(--leaf);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 15px;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .data-box {
            background: white;
            padding: 15px;
            border-radius: 20px;
            text-align: center;
        }

        .desc-text {
            font-family: 'Nunito', sans-serif;
            background: rgba(255, 255, 255, 0.5);
            padding: 20px;
            border-radius: 25px;
            font-size: 1rem;
            line-height: 1.5;
            color: #444;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes twinkle {
            from {
                opacity: 0.3;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .loader-dots {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .dot {
            width: 15px;
            height: 15px;
            background: var(--flower);
            border-radius: 50%;
            display: inline-block;
            margin: 0 5px;
            animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce {
            to {
                transform: translateY(-15px);
            }
        }
    </style>
</head>

<body>

    <div class="bird" style="animation-delay: 0s;"></div>
    <div class="bird" style="animation-delay: 5s;"></div>

    <section id="frontPage">
        <div class="hero-title">
            <span class="sparkle" style="top: -20px; left: -20px;">✨</span>
            <span class="sparkle" style="bottom: -10px; right: -20px;">🌸</span>
            <h1>FLORA<br>GLADE</h1>
        </div>
        <p style="font-size: 1.2rem; font-weight: 600; margin-top: 15px; opacity: 0.7;">
            Discover the Magic of Plants
        </p>
        <button class="start-btn" onclick="launchApp()">LET'S GO!</button>
    </section>

    <section id="app">
        <div class="glass-hud">
            <div class="cam-view" id="camView">
                <div class="scan-overlay"></div>
                <video id="video" autoplay playsinline muted></video>
            </div>

            <button class="capture-trigger" id="captureBtn" onclick="takePhoto()"></button>

            <div id="loader" class="loader-dots">
                <div class="dot"></div>
                <div class="dot" style="animation-delay: 0.2s"></div>
                <div class="dot" style="animation-delay: 0.4s"></div>
            </div>

            <canvas id="canvas" style="display:none;"></canvas>

            <div id="result">
                <div class="plant-preview">
                    <img id="refImage" src="" alt="Nature">
                </div>

                <div class="info-pill">✨ Magic Match Found</div>
                <h2 id="pName" style="font-size: 2.2rem; margin-bottom: 5px;">---</h2>
                <p id="cName" style="font-style: italic; color: #666; margin-bottom: 20px;">---</p>

                <div class="data-grid">
                    <div class="data-box">
                        <div style="font-size: 0.7rem; color: #999;">CONFIDENCE</div>
                        <div style="font-size: 1.4rem; font-weight: 800;"><span id="pAcc">0</span>%</div>
                    </div>
                    <div class="data-box">
                        <div style="font-size: 0.7rem; color: #999;">TYPE</div>
                        <div style="font-size: 1.4rem; font-weight: 800;">Plant</div>
                    </div>
                </div>

                <div class="desc-text" id="pDesc">Scanning botanical vibes...</div>

                <button class="start-btn" style="width: 100%; margin-top: 20px; font-size: 1.2rem; padding: 15px;"
                    onclick="resetApp()">SCAN AGAIN</button>
            </div>
        </div>
    </section>

    <script>
        const video = document.getElementById('video');
        const camView = document.getElementById('camView');
        const captureBtn = document.getElementById('captureBtn');
        const result = document.getElementById('result');
        const API_KEY = "IzN8CFTeHi9xED01K1g8w6XZns0urHn3UzL7StgtPkVw69PW3i";

        function launchApp() {
            const fp = document.getElementById('frontPage');
            fp.style.opacity = '0';
            fp.style.transform = 'translateY(-100vh)';

            setTimeout(() => {
                fp.style.display = 'none';
                document.getElementById('app').style.display = 'block';
                setTimeout(() => document.getElementById('app').style.opacity = '1', 50);
                startCamera();
            }, 800);
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
            } catch (e) { alert("Enable Camera to see Magic!"); }
        }

        async function takePhoto() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            const base64 = canvas.toDataURL('image/jpeg').split(',')[1];

            document.getElementById('loader').style.display = 'block';
            captureBtn.style.display = 'none';

            try {
                const res = await fetch("https://plant.id/api/v3/identification?details=common_names,description,image", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Api-Key": API_KEY },
                    body: JSON.stringify({ images: [base64] })
                });

                const data = await res.json();
                const plant = data.result?.classification?.suggestions?.[0];

                if (plant) {
                    camView.classList.add('mini');
                    document.getElementById('loader').style.display = 'none';

                    document.getElementById('pName').innerText = plant.name;
                    document.getElementById('cName').innerText = plant.details?.common_names?.[0] || "Forest Wonder";
                    document.getElementById('pAcc').innerText = (plant.probability * 100).toFixed(1);
                    document.getElementById('pDesc').innerText = plant.details?.description?.value || "A beautiful creation of nature with unique characteristics.";

                    if (plant.details?.image?.value) {
                        document.getElementById('refImage').src = plant.details.image.value;
                    }
                    result.style.display = 'block';
                }
            } catch (err) {
                alert("Magic connection lost! Try again.");
                resetApp();
            }
        }

        function resetApp() {
            camView.classList.remove('mini');
            result.style.display = 'none';
            captureBtn.style.display = 'block';
            document.getElementById('loader').style.display = 'none';
        }
    </script>
</body>

</html>
